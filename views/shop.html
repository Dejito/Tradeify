<!DOCTYPE html>
<html lang="en">
<head>

        }

            width: 100%;
            height: 3.5rem;

        }
        .main-header__nav {
            height: 100%;
            display: flex;
            align-items: center;
        }
        .main-header__item-list {

        <nav class="main-header__nav">
